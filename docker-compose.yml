name: alejandria-magazine

networks:
  alexandria_network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: alejandria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alejandria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alexandria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alejandria"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: alejandria_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alexandria_network

  ollama:
    image: ollama/ollama:latest
    container_name: alejandria_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - alexandria_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alejandria_backend
    restart: unless-stopped
    environment:
      APP_NAME: "Alejandria Magazine"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/alejandria"
      SECRET_KEY: "local-dev-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2"
    depends_on:
      postgres:
        condition: service_healthy   # Postgres se mantiene estricto porque inicializa rápido
      qdrant:
        condition: service_started   # Cambiado a service_started para evitar el error de Podman
      ollama:
        condition: service_started   # Cambiado a service_started para evitar el error de Podman
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    networks:
      - alexandria_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alejandria_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - alexandria_network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local