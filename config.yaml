app:
  name: "Alejandria Magazine"
  version: "0.1.0"
  api_prefix: "/api/v1"
  debug: true

security:
  algorithm: "HS256"
  access_token_expire_minutes: 30

database:
  url: "postgresql+asyncpg://postgres:password@localhost:5432/alejandria"

qdrant:
  url: "http://qdrant:6333"
  collection: "rag_docs"
  vector_size: 1536                 # Tamaño estándar de embeddings (nomic-embed-text)

ollama:
  base_url: "http://ollama:11434"
  default_model: "llama3.2"
  temperature: 0.3

editorial_rules:
  min_approval_score: 80
  allow_custom_topology: true      # Permite al usuario diseñar su flujo dinámico